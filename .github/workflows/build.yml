name: Android Build

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Mirrors the command JitPack runs for every tag (see jitpack.yml for the JDK).
      - name: JitPack build
        run: ./gradlew clean -Pgroup=com.github.knocklabs -Pversion=ci -xtest -xlint assemble publishToMavenLocal --stacktrace

      - name: Run unit tests
        run: ./gradlew :sdk:testDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew lint --stacktrace

      - name: Upload reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports
          path: |
            sdk/build/reports/
            sdk/build/test-results/
            knock-example-app/build/reports/
          retention-days: 7
